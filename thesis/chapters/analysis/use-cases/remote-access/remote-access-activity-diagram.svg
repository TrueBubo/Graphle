<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="578px" preserveAspectRatio="none" style="width:794px;height:578px;background:#FFFFFF;" version="1.1" viewBox="0 0 794 578" width="794px" zoomAndPan="magnify"><defs/><g><ellipse cx="456.4659" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="401.7709" x="255.5805" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="381.7709" x="265.5805" y="72.8281">The user starts SSH port forwarding to the remote GraphleManager</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="372.1786" x="270.3766" y="106.3441"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="352.1786" x="280.3766" y="129.1722">The user configures the server URL to the forwarded local port</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="201.0933" x="355.9192" y="162.6882"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="181.0933" x="365.9192" y="185.5163">The user opens the Graphle GUI</text><polygon fill="#F1F1F1" points="393.6288,219.0323,519.303,219.0323,531.303,231.0323,519.303,243.0323,393.6288,243.0323,381.6288,231.0323,393.6288,219.0323" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="125.6741" x="393.6288" y="235.3003">Connection established?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.6989" x="363.93" y="227.8094">Yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="15.0149" x="531.303" y="227.8094">No</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="323.8181" x="90.9866" y="253.0323"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="303.8181" x="100.9866" y="275.8604">GraphleManager opens the configured home location</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="362.4105" x="71.6904" y="309.3765"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="342.4105" x="81.6904" y="332.2045">The application shows neighbors from the remote filesystem</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="483.7913" x="11" y="415.2115"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="463.7913" x="21" y="438.0396">The GUI downloads a local copy or opens the file in place when configured as local</text><polygon fill="#F1F1F1" points="204.2705,365.7206,301.5208,365.7206,313.5208,377.7206,301.5208,389.7206,204.2705,389.7206,192.2705,377.7206,204.2705,365.7206" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.6989" x="256.8957" y="401.4795">Yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="97.2503" x="204.2705" y="381.9885">Open selected file?</text><polygon fill="#F1F1F1" points="252.8957,471.5556,264.8957,483.5556,252.8957,495.5556,240.8957,483.5556,252.8957,471.5556" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="230.1095" x="544.9814" y="253.0323"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="210.1095" x="554.9814" y="275.8604">The system shows a connection error</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="246.4896" x="536.7913" y="309.3765"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="226.4896" x="546.7913" y="332.2045">The user fixes or restarts the SSH tunnel</text><polygon fill="#F1F1F1" points="456.4659,501.5556,468.4659,513.5556,456.4659,525.5556,444.4659,513.5556,456.4659,501.5556" style="stroke:#181818;stroke-width:0.5;"/><ellipse cx="456.4659" cy="556.5556" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="456.4659" cy="556.5556" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="456.4659" x2="456.4659" y1="30" y2="50"/><polygon fill="#181818" points="452.4659,40,456.4659,50,460.4659,40,456.4659,44" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="456.4659" x2="456.4659" y1="86.3441" y2="106.3441"/><polygon fill="#181818" points="452.4659,96.3441,456.4659,106.3441,460.4659,96.3441,456.4659,100.3441" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="456.4659" x2="456.4659" y1="142.6882" y2="162.6882"/><polygon fill="#181818" points="452.4659,152.6882,456.4659,162.6882,460.4659,152.6882,456.4659,156.6882" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="252.8957" x2="252.8957" y1="289.3765" y2="309.3765"/><polygon fill="#181818" points="248.8957,299.3765,252.8957,309.3765,256.8957,299.3765,252.8957,303.3765" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="252.8957" x2="252.8957" y1="389.7206" y2="415.2115"/><polygon fill="#181818" points="248.8957,405.2115,252.8957,415.2115,256.8957,405.2115,252.8957,409.2115" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stro