<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="661px" preserveAspectRatio="none" style="width:938px;height:661px;background:#FFFFFF;" version="1.1" viewBox="0 0 938 661" width="938px" zoomAndPan="magnify"><defs/><g><ellipse cx="558.729" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="198.0213" x="459.7183" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="178.0213" x="469.7183" y="72.8281">The user opens the file browser</text><polygon fill="#F1F1F1" points="470.1301,106.3441,647.3278,106.3441,659.3278,118.3441,647.3278,130.3441,470.1301,130.3441,458.1301,118.3441,470.1301,106.3441" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="177.1977" x="470.1301" y="122.6121">Does the user want to use the GUI</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.6989" x="440.4312" y="115.1211">Yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="15.0149" x="659.3278" y="115.1211">No</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="240.3936" x="223.3644" y="140.3441"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="220.3936" x="233.3644" y="163.1722">The user searches for the parent folder</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="326.3143" x="180.404" y="196.6882"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="306.3143" x="190.404" y="219.5163">The user opens the context menu on the parent folder</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="165.7531" x="260.6846" y="253.0323"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="145.7531" x="270.6846" y="275.8604">The user selects "Add file"</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="283.3419" x="201.8902" y="309.3765"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="263.3419" x="211.8902" y="332.2045">The system displays a dialog for the new name</text><polygon fill="#F1F1F1" points="264.1252,365.7206,422.9971,365.7206,434.9971,377.7206,422.9971,389.7206,264.1252,389.7206,252.1252,377.7206,264.1252,365.7206" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="158.8719" x="264.1252" y="381.9885">Does the user want to proceed</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.6989" x="234.4264" y="374.4976">Yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="15.0149" x="434.9971" y="374.4976">No</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="297.274" x="45.2003" y="399.7206"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="277.274" x="55.2003" y="422.5487">The user enters the name and submits the dialog</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="169.9411" x="108.8667" y="456.0647"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="149.9411" x="118.8667" y="478.8928">The system creates the file</text><rect fill="#F1F1F1" height="